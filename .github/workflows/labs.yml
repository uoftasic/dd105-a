# The reference solutions, checked in the course image.
#
# For every lab, the starter's `make check` must FAIL (its test passes the
# lab's bug) and the solution's must PASS. labs/ref's `make check-all` must
# catch all 15 planted bugs, and labs/common's selftest must pass with every
# grader run end to end. scripts/ci/check-labs.sh is each check, and
# scripts/ci/in-image.sh runs it in the course image, so every step below can
# be rehearsed on any machine with Docker by running the same command.
#
# The image is the course image, hpretl/iic-osic-tools:2026.08, pinned by
# digest, so CI runs the Verilator 5.050, Yices and g++ that every expected
# output in the course came from. The UVM library is the copy in third_party/.
# Each check runs with the course's limits of 2 CPUs and 3 GB, so a CI time
# compares with the times on the lab pages, and a build that outgrows 3 GB
# fails here as it would for a student.
#
# Disk: the image is 3.76 GB to download and 11.7 GB unpacked. GitHub
# documents 14 GB of SSD for its standard Linux runners, which can't hold it,
# so the job first removes preinstalled toolchains this course doesn't use,
# with jlumbroso/free-disk-space pinned by commit, and then checks there is
# room. We chose that over building a smaller image (it would no longer be the
# course image) and over building Verilator here (a different binary from the
# one students run).
#
# Time: one job, the checks one after another. Rehearsed on Nov 16, 2026, on a
# local machine with the same commands and limits, every check passing: 29 min
# 39 s with an empty ccache (16 builds of 82 to 123 s each), and 6 min
# 42 s with the ccache that run left (every build 10 to 19 s), which is what
# actions/cache gives every run after the first. Add the free-disk step and the
# pull of the image, which a local rehearsal can't measure.
#
# The weekly run catches breakage from outside the repo: a digest Docker Hub
# stops serving, or a change to GitHub's runners.
name: Labs

on:
  push:
    branches: [main]
    paths:
      - "labs/**"
      - "third_party/**"
      - "scripts/ci/**"
      - ".github/workflows/labs.yml"
  pull_request:
    paths:
      - "labs/**"
      - "third_party/**"
      - "scripts/ci/**"
      - ".github/workflows/labs.yml"
  schedule:
    - cron: "41 6 * * 1"   # Mondays, 06:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labs-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # bash -eo pipefail, so a failing check isn't hidden by tee

env:
  IMAGE: hpretl/iic-osic-tools@sha256:3c371645b19c6f6564dc8c7b21e39ad1c1833d274fe5b85639afe1ba9d7987e7

jobs:
  reference-solutions:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The apt removals ("large-packages") take minutes and free little that
      # we need, and the swap file stays, as on the machines the course was
      # measured on.
      - name: Make room for the course image
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          tool-cache: false
          swap-storage: false

      # 3.8 GB of download, 11.7 GB unpacked, and about 4 GB for one lab's
      # build at a time and the ccache.
      - name: Check there is room
        run: |
          df -h /
          avail_gb=$(( $(df --output=avail -k / | tail -n 1) / 1024 / 1024 ))
          if [ "$avail_gb" -lt 20 ]; then
            echo "::error::Only $avail_gb GB free on /. The course image and the builds need about 20 GB."
            exit 1
          fi

      - name: Pull the course image
        run: docker pull "$IMAGE"

      # ccache keys on what it compiles, so a restored cache can only make a
      # build faster, never different. A new cache is saved after each run
      # that passes.
      - name: Restore the ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: labs/common selftest
        run: scripts/ci/in-image.sh scripts/ci/check-labs.sh selftest | tee -a "$RUNNER_TEMP/ci.log"

      # The steps below run even if one before them failed, so one run
      # reports every lab.
      - name: labs/ref, check-all
        if: success() || failure()
        run: scripts/ci/in-image.sh scripts/ci/check-labs.sh ref | tee -a "$RUNNER_TEMP/ci.log"

      - name: Lab 01
        if: success() || failure()
        run: scripts/ci/in-image.sh scripts/ci/check-labs.sh lab lab-01-one-alu-two-testbenches | tee -a "$RUNNER_TEMP/ci.log"

      - name: Lab 02
        if: success() || failure()
        run: scripts/ci/in-image.sh scripts/ci/check-labs.sh lab lab-02-a-class-testbench-without-uvm | tee -a "$RUNNER_TEMP/ci.log"

      - name: Lab 03
        if: success() || failure()
        run: scripts/ci/in-image.sh scripts/ci/check-labs.sh lab lab-03-constraints-and-coverage | tee -a "$RUNNER_TEMP/ci.log"

      - name: Lab 04
        if: success() || failure()
        run: scripts/ci/in-image.sh scripts/ci/check-labs.sh lab lab-04-the-same-testbench-in-uvm | tee -a "$RUNNER_TEMP/ci.log"

      - name: Lab 05
        if: success() || failure()
        run: scripts/ci/in-image.sh scripts/ci/check-labs.sh lab lab-05-protocol-rules-and-backpressure | tee -a "$RUNNER_TEMP/ci.log"

      - name: Lab 06
        if: success() || failure()
        run: scripts/ci/in-image.sh scripts/ci/check-labs.sh lab lab-06-the-register-block | tee -a "$RUNNER_TEMP/ci.log"

      - name: Lab 07
        if: success() || failure()
        run: scripts/ci/in-image.sh scripts/ci/check-labs.sh lab lab-07-capstone | tee -a "$RUNNER_TEMP/ci.log"

      - name: Summary
        if: success() || failure()
        run: |
          {
            echo '### Reference solutions'
            echo '```'
            grep -E '^(CI:|    ccache:)' "$RUNNER_TEMP/ci.log" || echo "no check finished"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A check that fails keeps its build folders, so its logs are here.
      - name: Keep the logs of a failed check
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab-logs
          path: |
            labs/**/build/build.log
            labs/**/build/grade/**/run.log
            labs/**/build/runs/**/run.log
          if-no-files-found: ignore
