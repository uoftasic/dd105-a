# Quarto build of the DD105-A docs (replacing Docsify's index.html,
# _sidebar.md and _navbar.md).
#
#   quarto preview docs          # live site at http://localhost:4200
#   quarto render docs           # site in docs/_site, with a PDF of every page
#   quarto render docs --profile pdf --to typst
#                                # the whole course as one PDF in docs/_book
#
# The sidebar follows the Course path order on the home page.

project:
  type: website
  output-dir: _site
  # quarto preview docs serves the site here (otherwise Quarto picks a random port).
  preview:
    port: 4200
    browser: false

website:
  title: "DD105-A — Testbenches with UVM"
  description: "Build a UVM testbench in SystemVerilog on Verilator, and find out what the framework costs and buys."
  site-url: https://uoftasic.com/dd105-a/
  repo-url: https://github.com/uoftasic/dd105-a
  repo-subdir: docs
  repo-actions: [issue]
  search: true
  page-navigation: true
  navbar:
    left:
      - text: "Guide"
        href: guide/getting-started.md
      - text: "Labs"
        href: labs/lab-01-one-alu-two-testbenches-overview.md
    right:
      - text: Course PDF
        icon: file-pdf
        href: "dd105-a-course.pdf"
      - icon: github
        href: https://github.com/uoftasic/dd105-a
        aria-label: GitHub
  sidebar:
    # Floating centres the sidebar, the page and "On this page" on a wide
    # screen. Docked pins the sidebar to the left edge and leaves all the
    # spare width on the right.
    style: floating
    contents:
      - text: "Home"
        href: index.md
      - section: "1. Two testbenches"
        contents:
          - text: "Getting started"
            href: guide/getting-started.md
          - text: "What a framework buys you"
            href: guide/what-a-framework-buys-you.md
          - text: "From cocotb to SystemVerilog classes"
            href: guide/from-cocotb-to-systemverilog-classes.md
          - text: "Lab 01: One ALU, two testbenches"
            href: labs/lab-01-one-alu-two-testbenches-overview.md
      - section: "2. Classes"
        contents:
          - text: "Classes for testbenches"
            href: guide/classes-for-testbenches.md
          - text: "Interfaces, clocking blocks and virtual interfaces"
            href: guide/interfaces-clocking-blocks-and-virtual-interfaces.md
          - text: "Threads, mailboxes and events"
            href: guide/threads-mailboxes-and-events.md
          - text: "Lab 02: A class testbench without UVM"
            href: labs/lab-02-a-class-testbench-without-uvm-overview.md
      - section: "3. Constraints and coverage"
        contents:
          - text: "Constrained random on Verilator"
            href: guide/constrained-random-on-verilator.md
          - text: "Functional coverage you can read"
            href: guide/functional-coverage-you-can-read.md
          - text: "Lab 03: Constraints and coverage"
            href: labs/lab-03-constraints-and-coverage-overview.md
      - section: "4. UVM"
        contents:
          - text: "The UVM skeleton"
            href: guide/the-uvm-skeleton.md
          - text: "Sequences, sequencers and drivers"
            href: guide/sequences-sequencers-and-drivers.md
          - text: "Monitors, analysis ports and scoreboards"
            href: guide/monitors-analysis-ports-and-scoreboards.md
          - text: "The factory and config_db"
            href: guide/the-factory-and-config-db.md
          - text: "Lab 04: The same testbench in UVM"
            href: labs/lab-04-the-same-testbench-in-uvm-overview.md
      - section: "5. Protocol rules"
        contents:
          - text: "Assertions for interface rules"
            href: guide/assertions-for-interface-rules.md
          - text: "Reactive agents and backpressure"
            href: guide/reactive-agents-and-backpressure.md
          - text: "Virtual sequences"
            href: guide/virtual-sequences.md
          - text: "Lab 05: Protocol rules and backpressure"
            href: labs/lab-05-protocol-rules-and-backpressure-overview.md
      - section: "6. Registers"
        contents:
          - text: "Register models"
            href: guide/register-models.md
          - text: "Regressions and seeds"
            href: guide/regressions-and-seeds.md
          - text: "Lab 06: The register block"
            href: labs/lab-06-the-register-block-overview.md
      - section: "7. Capstone"
        contents:
          - text: "Verification plans and sign-off"
            href: guide/verification-plans-and-sign-off.md
          - text: "Writing the verification report"
            href: guide/writing-the-verification-report.md
          - text: "Lab 07: Capstone"
            href: labs/lab-07-capstone-overview.md
      - section: "Reference"
        contents:
          - text: "The router in one page"
            href: reference/the-router-in-one-page.md
          - text: "The packet router"
            href: reference/router-spec.md
          - text: "The UVM register layer"
            href: reference/register-layer.md
          - text: "Getting the tools outside the course image"
            href: reference/getting-the-tools-outside-the-course-image.md
      - section: "Repo"
        contents:
          - text: "Lab packages"
            href: https://github.com/uoftasic/dd105-a/tree/main/labs
          - text: "The shared build and graders"
            href: https://github.com/uoftasic/dd105-a/tree/main/labs/common
          - text: "The reference testbench"
            href: https://github.com/uoftasic/dd105-a/tree/main/labs/ref

filters:
  - _filters/course.lua

# Collapsed answers move to the end of each page in PDFs; set this to
# "inline" to print them where they sit instead.
answers-in-pdf: end

format:
  html:
    # Widths of the sidebar, the text column and "On this page". Quarto takes
    # 3em off body-width, so on a screen about 1450px or wider the text column
    # is about 950px: about 130 characters of text or 106 of code a line. On a
    # narrower screen the text column gives up width before the sidebars do.
    grid:
      sidebar-width: 200px
      margin-width: 200px
      body-width: 1000px
    theme:
      light: [cosmo, _light.scss]
      dark: [darkly, _dark.scss]
    css: _styles.css
    # Keeps old Docsify links (.../dd105-a/#/labs/...) working.
    include-in-header: _docsify-redirect.html
    toc: true
    toc-depth: 3
    code-copy: true
    lightbox: auto
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml-full.js"
    # Listing html first stops Quarto adding a second "Typst" link.
    format-links:
      - html
      - format: typst
        text: PDF
        icon: file-pdf
  typst:
    papersize: us-letter
    margin:
      x: 0.9in
      y: 0.9in
    fontsize: 10.5pt
    toc: false
