# The whole course as one PDF:
#   quarto render docs --profile pdf --to typst      # writes docs/_book/*.pdf
# Chapter order follows the sidebar in _quarto.yml.

project:
  type: book
  output-dir: _book

book:
  title: "DD105-A — Testbenches with UVM"
  subtitle: "Build a UVM testbench in SystemVerilog on Verilator, and find out what the framework costs and buys."
  author: "UofT ASIC Team"
  output-file: "dd105-a-course"
  chapters:
    - index.md
    - part: "1. Two testbenches"
      chapters:
        - guide/getting-started.md
        - guide/what-a-framework-buys-you.md
        - guide/from-cocotb-to-systemverilog-classes.md
        - labs/lab-01-one-alu-two-testbenches-overview.md
    - part: "2. Classes"
      chapters:
        - guide/classes-for-testbenches.md
        - guide/interfaces-clocking-blocks-and-virtual-interfaces.md
        - guide/threads-mailboxes-and-events.md
        - labs/lab-02-a-class-testbench-without-uvm-overview.md
    - part: "3. Constraints and coverage"
      chapters:
        - guide/constrained-random-on-verilator.md
        - guide/functional-coverage-you-can-read.md
        - labs/lab-03-constraints-and-coverage-overview.md
    - part: "4. UVM"
      chapters:
        - guide/the-uvm-skeleton.md
        - guide/sequences-sequencers-and-drivers.md
        - guide/monitors-analysis-ports-and-scoreboards.md
        - guide/the-factory-and-config-db.md
        - labs/lab-04-the-same-testbench-in-uvm-overview.md
    - part: "5. Protocol rules"
      chapters:
        - guide/assertions-for-interface-rules.md
        - guide/reactive-agents-and-backpressure.md
        - guide/virtual-sequences.md
        - labs/lab-05-protocol-rules-and-backpressure-overview.md
    - part: "6. Registers"
      chapters:
        - guide/register-models.md
        - guide/regressions-and-seeds.md
        - labs/lab-06-the-register-block-overview.md
    - part: "7. Capstone"
      chapters:
        - guide/verification-plans-and-sign-off.md
        - guide/writing-the-verification-report.md
        - labs/lab-07-capstone-overview.md
  appendices:
    - reference/the-router-in-one-page.md
    - reference/router-spec.md
    - reference/register-layer.md
    - reference/getting-the-tools-outside-the-course-image.md

format:
  typst:
    toc: true
    toc-depth: 1
