# The whole course as one PDF:
#   quarto render docs --profile pdf --to typst      # writes docs/_book/*.pdf
# Chapter order follows the sidebar in _quarto.yml.

project:
  type: book
  output-dir: _book

book:
  title: "DD105-A — Testbenches with UVM"
  subtitle: "Build a UVM testbench in SystemVerilog on Verilator, and find out what the framework costs and buys."
  author: "UofT ASIC Team"
  output-file: "dd105-a-course"
  chapters:
    - index.md
    - part: "Course path"
      chapters:
        - guide/getting-started.md
        - labs/lab-01-overview.md

format:
  typst:
    toc: true
    toc-depth: 1
